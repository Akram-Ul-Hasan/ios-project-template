# Runs on merge requests, dev and main. Needs a self-hosted macOS runner tagged `macos`
# with the Xcode version from .xcode-version (GitLab SaaS macOS runners are a paid tier).

stages:
  - lint
  - build
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

variables:
  IOS_SIMULATOR: "iPhone 17"
  DERIVED_DATA: "$CI_PROJECT_DIR/.build/DerivedData"

default:
  tags: [macos]
  interruptible: true
  before_script:
    - expected=$(tr -d '[:space:]' < .xcode-version); actual=$(xcodebuild -version | awk 'NR==1 {print $2}')
    - '[ "$actual" = "$expected" ] || { echo "Runner has Xcode $actual, .xcode-version wants $expected"; exit 1; }'

lint:git:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: 0   # needs history back to the MR base
  script:
    - scripts/lint_git.sh "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" "$CI_MERGE_REQUEST_TITLE" "$CI_MERGE_REQUEST_DIFF_BASE_SHA"

lint:format:
  stage: lint
  script:
    - swift format lint --strict --recursive App Packages/AppModules

lint:target-graph:
  stage: lint
  script:
    - scripts/check_target_graph.sh

lint:banned-api:
  stage: lint
  script:
    - scripts/banned_api_check.sh

build:
  stage: build
  parallel:
    matrix:
      - FLAVOR: [Development, Staging, Production]
  script:
    - xcodebuild build -quiet
        -project ios-project-template.xcodeproj
        -scheme "ProjectTemplate-$FLAVOR"
        -destination 'generic/platform=iOS Simulator'
        -derivedDataPath "$DERIVED_DATA"
        CODE_SIGNING_ALLOWED=NO

test:
  stage: test
  script:
    - rm -rf coverage && mkdir coverage
    - xcodebuild test -quiet
        -project ios-project-template.xcodeproj
        -scheme ProjectTemplate-Development
        -destination "platform=iOS Simulator,name=$IOS_SIMULATOR"
        -derivedDataPath "$DERIVED_DATA"
        -resultBundlePath coverage/Tests.xcresult
        -enableCodeCoverage YES
        -collect-test-diagnostics never
        CODE_SIGNING_ALLOWED=NO
    - xcrun xccov view --report --json coverage/Tests.xcresult > coverage/coverage.json
    - 'jq -r ''"Coverage: \(.lineCoverage * 100 | . * 100 | round / 100)%"'' coverage/coverage.json'
  coverage: '/Coverage: \d+(?:\.\d+)?%/'
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - coverage/
